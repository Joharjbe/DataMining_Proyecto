services:
  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - "/Users/nahiaescalante/Documents/UTEC/2026-1/Data_Mining/Proyecto/DataMining_Proyecto:/Users/nahiaescalante/Documents/UTEC/2026-1/Data_Mining/Proyecto/DataMining_Proyecto"
    networks:
      - spark-network

  spark-worker-1:
    image: apache/spark:latest
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - "/Users/nahiaescalante/Documents/UTEC/2026-1/Data_Mining/Proyecto/DataMining_Proyecto:/Users/nahiaescalante/Documents/UTEC/2026-1/Data_Mining/Proyecto/DataMining_Proyecto"
    networks:
      - spark-network

  spark-worker-2:
    image: apache/spark:latest
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    volumes:
      - "/Users/nahiaescalante/Documents/UTEC/2026-1/Data_Mining/Proyecto/DataMining_Proyecto:/Users/nahiaescalante/Documents/UTEC/2026-1/Data_Mining/Proyecto/DataMining_Proyecto"
    networks:
      - spark-network

networks:
  spark-network:
